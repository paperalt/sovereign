name: Sovereign Android CI & Verification
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-build:
    name: Autonomous UI Audit & Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run UI Sanitation & Design Auditor
        run: |
          python3 test/eval_harness/ui_sanitation_auditor.py

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Compile and Assemble Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --parallel -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseG1GC"
