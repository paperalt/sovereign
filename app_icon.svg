<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141A22"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#283342" stroke-width="4"/>

  <!-- Glowing Soundwave Accent -->
  <g filter="url(#shadow)">
    <!-- Active Recording Crimson Dot -->
    <circle cx="256" cy="120" r="14" fill="#E11D48"/>

    <!-- Microphone Capsule -->
    <rect x="220" y="160" width="72" height="120" rx="36" fill="#38BDF8"/>
    <!-- Microphone Grille Divider Line -->
    <line x1="220" y1="216" x2="292" y2="216" stroke="#0A0D12" stroke-width="5"/>

    <!-- Arc Cradle -->
    <path d="M 180,224 C 180,270 214,308 256,308 C 298,308 332,270 332,224" fill="none" stroke="#F0F4F8" stroke-width="12" stroke-linecap="round"/>

    <!-- Stand & Base -->
    <line x1="256" y1="308" x2="256" y2="368" stroke="#F0F4F8" stroke-width="12" stroke-linecap="round"/>
    <line x1="200" y1="368" x2="312" y2="368" stroke="#F0F4F8" stroke-width="12" stroke-linecap="round"/>

    <!-- Flanking Soundwave Frequencies (Left) -->
    <line x1="140" y1="190" x2="140" y2="258" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
    <line x1="104" y1="208" x2="104" y2="240" stroke="#475569" stroke-width="10" stroke-linecap="round"/>

    <!-- Flanking Soundwave Frequencies (Right) -->
    <line x1="372" y1="190" x2="372" y2="258" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
    <line x1="408" y1="208" x2="408" y2="240" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
