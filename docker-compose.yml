services:
  # ----------------------------------------------------------------------------
  # Transcribe Core - Go Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: transcribe-core-backend:latest
    container_name: transcribe-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - BIND_HOST=0.0.0.0
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-transcribe_secure_pass_replace_in_production}
      - DB_NAME=${DB_NAME:-transcribe}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - SQLITE_PATH=${SQLITE_PATH:-/data/transcribe.db}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-signing-key-default-32bytes}
      - NINEROUTER_URL=${NINEROUTER_URL:-http://host.docker.internal:20128/v1}
      - NINEROUTER_KEY=${NINEROUTER_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-ag/gemini-3.8-flash}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-709542679592-lprl5ob7uv2ktin74idhg4347n8urbuk.apps.googleusercontent.com}
      - ALLOW_PASSWORD_AUTH=${ALLOW_PASSWORD_AUTH:-false}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - DOWNLOADS_DIR=/app/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - downloads_data:/app/downloads
      - sqlite_data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - transcribe_net
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Alpine Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: transcribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-transcribe}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transcribe_secure_pass_replace_in_production}
    ports:
      - "${DB_EXTERNAL_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-transcribe}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - transcribe_net
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  postgres_data:
    name: transcribe_postgres_data
  sqlite_data:
    name: transcribe_sqlite_data
  downloads_data:
    name: transcribe_downloads_data

networks:
  transcribe_net:
    name: transcribe_network
    driver: bridge
